# Choose a unique app name with Fly before deployment.
app = "vantage-v2"
primary_region = "lhr"
[build]
  dockerfile = "Dockerfile"
[env]
  NODE_ENV = "production"
  PORT = "3001"
  VANTAGE_NETWORK = "studionet"
[processes]
  web = "node backend/src/server.js"
  worker = "node backend/src/v2/worker.js"
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v2/health"
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
